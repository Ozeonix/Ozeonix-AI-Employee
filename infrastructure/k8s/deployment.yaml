apiVersion: apps/v1
kind: Deployment
metadata:
  name: ozeonix-backend
  labels:
    app: ozeonix-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ozeonix-backend
  template:
    metadata:
      labels:
        app: ozeonix-backend
    spec:
      containers:
        - name: backend
          image: ozeonix/backend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ozeonix-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ozeonix-backend-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: ozeonix-backend
